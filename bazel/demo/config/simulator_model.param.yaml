# autoware_simple_planning_simulator's simple_planning_simulator_default.param.yaml, with road slope simulation off.
# autoware_core's controller has no slope compensation: uphill it settles below the velocity smoother's engage
# velocity (0.25 m/s) and the vehicle creeps.
/**:
  ros__parameters:
    simulated_frame_id: "base_link"
    origin_frame_id: "map"
    vehicle_model_type: "DELAY_STEER_ACC_GEARED"
    initialize_source: "INITIAL_POSE_TOPIC"
    timer_sampling_time_ms: 25
    add_measurement_noise: False
    vel_lim: 30.0
    vel_rate_lim: 30.0
    steer_lim: 0.6
    steer_rate_lim: 6.28
    acc_time_delay: 0.1
    acc_time_constant: 0.1
    steer_time_delay: 0.1
    steer_time_constant: 0.1
    steer_dead_band: 0.0
    x_stddev: 0.0001 # x standard deviation for dummy covariance in map coordinate
    y_stddev: 0.0001 # y standard deviation for dummy covariance in map coordinate
    enable_road_slope_simulation: false  # if true, slopes in the lanelet map are used to apply an extra acceleration to the ego vehicle

# Note: vehicle characteristics parameters (e.g. wheelbase) are defined in a separate file.
